<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>ServersTV</title>
<style>
:root{--bg:#090b0f;--panel:#11151c;--active:#1b2522;--green:#8cf0b2;--text:#f4f6f8;--muted:#89929e;--line:#252b34}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:43% 57%;align-items:center;padding:5vh 5vw;gap:3vw}
.left{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:35px}
.connect{width:min(30vw,390px);height:min(30vw,390px);min-width:220px;min-height:220px;border-radius:50%;border:5px solid #303943;background:radial-gradient(circle at 50% 40%,#19211f,#0e1216 70%);display:flex;align-items:center;justify-content:center;color:#89939c;font-size:clamp(65px,9vw,105px);cursor:pointer}
.connect.on{border-color:var(--green);color:var(--green);box-shadow:0 0 55px #8cf0b222}
.status{text-align:center}.status h2{font-size:clamp(22px,2.5vw,30px);margin:0 0 10px}.status p{color:var(--muted);font-size:16px;margin:0;max-width:360px}
.right{width:100%;max-width:780px;justify-self:center}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
h1{font-size:clamp(28px,3.5vw,43px);margin:0;letter-spacing:-1px}.count{color:var(--muted);margin:8px 0 0;font-size:15px}
.refresh{width:65px;height:65px;border:1px solid var(--line);border-radius:50%;background:var(--panel);color:var(--green);font-size:32px;cursor:pointer}
.list{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;max-height:68vh;overflow-y:auto}
.server{width:100%;min-height:86px;padding:16px 22px;display:flex;align-items:center;gap:17px;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--text);text-align:left;cursor:pointer}
.server:last-child{border-bottom:0}.server.selected{background:var(--active);box-shadow:inset 4px 0 var(--green)}
.flag{width:45px;height:45px;border-radius:12px;background:#202832;display:flex;align-items:center;justify-content:center;font-size:25px;flex-shrink:0}
.info{flex:1;min-width:0}.name{font-size:19px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.protocol{color:var(--muted);font-size:14px;margin-top:6px}.check{color:var(--green);font-size:22px;width:25px;text-align:center}.server:not(.selected) .check{visibility:hidden}
button:focus,input:focus{outline:3px solid var(--green);outline-offset:4px;z-index:2}.server:focus{background:#202c27}
.footer{margin-top:20px;display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.toast{position:fixed;bottom:30px;left:50%;transform:translate(-50%,20px);opacity:0;background:#1a2921;color:var(--green);border:1px solid #365b44;border-radius:30px;padding:14px 24px;transition:.2s;pointer-events:none;max-width:80vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:30px;z-index:10}.modal.open{display:flex}.dialog{width:min(620px,90vw);background:#141a20;border:1px solid #303943;border-radius:22px;padding:30px;box-shadow:0 20px 80px #0009}.dialog h2{margin:0 0 12px;font-size:26px}.dialog p{color:var(--muted);line-height:1.5}.dialog input{width:100%;height:58px;border-radius:12px;border:1px solid #39434e;background:#090d12;color:white;padding:0 16px;font-size:16px;margin:12px 0 18px}.actions{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}.actions button{padding:14px 20px;border-radius:12px;border:1px solid #39434e;background:#202832;color:white;font-size:16px}.actions .primary{background:#8cf0b2;color:#07110b;border-color:#8cf0b2;font-weight:700}
.registration-gate{position:fixed;inset:0;background:rgba(5,8,11,.97);display:flex;align-items:center;justify-content:center;padding:28px;z-index:20}.registration-card{width:min(620px,92vw);background:#141a20;border:1px solid #303943;border-radius:24px;padding:42px;text-align:center;box-shadow:0 25px 90px #000b}.registration-logo{font-size:17px;letter-spacing:3px;color:var(--green);font-weight:700;margin-bottom:24px}.registration-card h2{font-size:clamp(28px,4vw,38px);margin:0 0 14px}.registration-card p{font-size:18px;line-height:1.55;color:var(--muted);margin:0 auto 28px;max-width:480px}.primary-action{padding:15px 24px;border-radius:12px;border:0;background:var(--green);color:#07110b;font-size:17px;font-weight:700;cursor:pointer}.registration-gate.approved{display:none}@media(max-width:750px){.app{grid-template-columns:1fr;padding:20px;gap:20px;overflow:auto}.connect{width:180px;height:180px;min-width:180px;min-height:180px}.left{gap:15px}.server{min-height:70px}}
</style></head><body>
<div class="app">
<section class="left"><button class="connect" id="connect" aria-label="Подключить VPN">⏻</button><div class="status"><h2 id="status">Не подключено</h2><p id="description">Загружаю твою подписку…</p></div></section>
<section class="right"><div class="top"><div><h1>Серверы</h1><p class="count" id="count">Ожидание подтверждения</p></div><button class="refresh" id="refresh" aria-label="Обновить серверы">↻</button></div><div class="list" id="list"></div><div class="footer"><span>ServersTV</span><span id="selected">Сервер не выбран</span></div></section></div>
<div class="toast" id="toast"></div>
<div class="registration-gate" id="registrationGate">
  <div class="registration-card">
    <div class="registration-logo">ServersTV</div>
    <h2 id="registrationTitle">Отправляем запрос…</h2>
    <p id="registrationMessage">Подключаем приложение к системе подтверждения.</p>
    <button id="checkRegistration" class="primary-action">Проверить статус</button>
  </div>
</div>>
<script>
let servers=[],selected=0,connected=false,loading=false,registrationApproved=false;
const $=id=>document.getElementById(id);
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>$("toast").classList.remove("show"),2400)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function serverName(s,i){return String(s.remarks||s.name||s.outbounds?.[0]?.tag||("Сервер "+(i+1))).slice(0,90)}
function protocolName(s){return String(s.outbounds?.find(x=>x&&x.protocol)?.protocol||"Xray").toUpperCase()}
function flagFor(name){const m=name.match(/🇦🇱|🇦🇩|🇦🇹|🇧🇪|🇧🇬|🇭🇷|🇨🇾|🇨🇿|🇩🇰|🇪🇪|🇫🇮|🇫🇷|🇩🇪|🇬🇷|🇭🇺|🇮🇸|🇮🇪|🇮🇹|🇱🇻|🇱🇹|🇱🇺|🇲🇹|🇳🇱|🇳🇴|🇵🇱|🇵🇹|🇷🇴|🇷🇸|🇸🇰|🇸🇮|🇪🇸|🇸🇪|🇨🇭|🇹🇷|🇬🇧|🇺🇸|🇨🇦|🇯🇵|🇸🇬|🇷🇺/u);return m?m[0]:"🌐"}
function render(){
 const list=$("list");
 if(!servers.length){list.innerHTML="";$("count").textContent="Серверов нет";$("selected").textContent="Сервер не выбран";return}
 if(selected>=servers.length)selected=0;
 list.innerHTML=servers.map((s,i)=>{const name=serverName(s,i);return '<button class="server '+(i===selected?'selected':'')+'" data-id="'+i+'"><span class="flag">'+flagFor(name)+'</span><span class="info"><div class="name">'+escapeHtml(name.replace(/[🇦-🇿]{2}/gu,"").trim())+'</div><div class="protocol">'+escapeHtml(protocolName(s))+'</div></span><span class="check">✓</span></button>'}).join("");
 document.querySelectorAll(".server").forEach(b=>b.onclick=()=>{selected=+b.dataset.id;render();$("description").textContent="Выбран сервер для подключения";toast("Выбран: "+serverName(servers[selected],selected))});
 $("count").textContent="Твои серверы · "+servers.length+" доступно";
 $("selected").textContent="Выбран: "+serverName(servers[selected],selected);
}
window.onRegistrationStatus=function(status,detail){
 if(status==="pending"){
  $("registrationTitle").textContent="Запрос отправлен";
  $("registrationMessage").textContent="В Telegram отправлено уведомление. Ожидайте, пока владелец приложения примет запрос.";
  $("checkRegistration").style.display="inline-block";
 }else if(status==="approved"){
  if(registrationApproved)return;
  registrationApproved=true;
  $("registrationTitle").textContent="Доступ разрешён";
  $("registrationGate").classList.add("approved");
  clearInterval(window.registrationTimer);
  $("description").textContent="Загружаю серверы…";
  AndroidVpn.loadServers();
 }else if(status==="rejected"){
  $("registrationTitle").textContent="Запрос отклонён";
  $("registrationMessage").textContent="Владелец приложения отклонил регистрацию этого устройства.";
  $("checkRegistration").style.display="none";
  clearInterval(window.registrationTimer);
 }else if(status==="not_found"){
  $("registrationTitle").textContent="Отправляем запрос…";
  $("registrationMessage").textContent="Повторно отправляем запрос на регистрацию.";
  AndroidVpn.registerDevice();
 }else if(status==="error"){
  $("registrationTitle").textContent="Не удалось проверить регистрацию";
  $("registrationMessage").textContent=detail||"Проверь подключение к интернету и попробуй ещё раз.";
  $("checkRegistration").style.display="inline-block";
 }
};
window.onServersLoaded=function(body){
 try{
  const data=JSON.parse(body);
  if(!Array.isArray(data))throw Error("Неверный формат списка");
  servers=data;selected=0;render();
  $("description").textContent="Выбери сервер для подключения";
  toast("Серверы загружены");
 }catch(e){window.onServersError(e.message)}
};
window.onServersError=function(message){toast(message);$("description").textContent=message};
window.onVpnStatus=function(state,detail){
 if(state==="connected"){connected=true;$("connect").classList.add("on");$("status").textContent="Подключено";$("description").textContent=servers.length?serverName(servers[selected],selected):"VPN подключён"}
 else if(state==="disconnected"){connected=false;$("connect").classList.remove("on");$("status").textContent="Не подключено";$("description").textContent=detail||"Выбери сервер для подключения"}
 else if(state==="error"){connected=false;$("connect").classList.remove("on");$("status").textContent="Ошибка подключения";$("description").textContent=detail||"Xray не запустился";toast(detail||"Ошибка Xray")}
};
$("connect").onclick=()=>{
 if(connected){AndroidVpn.disconnect();return}
 if(!servers.length){toast("Серверы ещё не загружены");return}
 const config=servers[selected];
 $("status").textContent="Подключение…";$("description").textContent=serverName(config,selected);
 AndroidVpn.connect(JSON.stringify(config));
};
$("refresh").onclick=()=>{if(loading||!registrationApproved)return;loading=true;toast("Обновляю серверы…");AndroidVpn.loadServers();setTimeout(()=>loading=false,3000)};
$("checkRegistration").onclick=()=>{toast("Проверяю статус…");AndroidVpn.checkRegistration()};
document.addEventListener("keydown",e=>{
 const gate=$("registrationGate");
 if(!gate.classList.contains("approved")){
  if(["Enter"," "].includes(e.key)&&document.activeElement===$("checkRegistration")){$("checkRegistration").click();e.preventDefault()}
  return;
 }
 const all=[$("connect"),$("refresh"),...document.querySelectorAll(".server")],i=all.indexOf(document.activeElement);
 if(["ArrowDown","ArrowUp"].includes(e.key)){e.preventDefault();all[(Math.max(i,0)+(e.key==="ArrowDown"?1:all.length-1))%all.length]?.focus()}
 else if(["ArrowLeft","ArrowRight"].includes(e.key)){if(document.activeElement.classList.contains("server"))$("connect").focus();else if(document.activeElement===$("connect"))document.querySelector(".server")?.focus()}
});
AndroidVpn.registerDevice();
window.registrationTimer=setInterval(()=>AndroidVpn.checkRegistration(),5000);
</script></body></html>
