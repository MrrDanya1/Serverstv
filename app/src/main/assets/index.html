<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>ServersTV</title>
<style>
:root{--bg:#090b0f;--panel:#11151c;--active:#1b2522;--green:#8cf0b2;--text:#f4f6f8;--muted:#89929e;--line:#252b34}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:43% 57%;align-items:center;padding:5vh 5vw;gap:3vw}
.left{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:35px}
.connect{width:min(30vw,390px);height:min(30vw,390px);min-width:220px;min-height:220px;border-radius:50%;border:5px solid #303943;background:radial-gradient(circle at 50% 40%,#19211f,#0e1216 70%);display:flex;align-items:center;justify-content:center;color:#89939c;font-size:clamp(65px,9vw,105px);cursor:pointer}
.connect.on{border-color:var(--green);color:var(--green);box-shadow:0 0 55px #8cf0b222}
.status{text-align:center}.status h2{font-size:clamp(22px,2.5vw,30px);margin:0 0 10px}.status p{color:var(--muted);font-size:16px;margin:0}
.right{width:100%;max-width:780px;justify-self:center}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
h1{font-size:clamp(28px,3.5vw,43px);margin:0;letter-spacing:-1px}.count{color:var(--muted);margin:8px 0 0;font-size:15px}
.refresh{width:65px;height:65px;border:1px solid var(--line);border-radius:50%;background:var(--panel);color:var(--green);font-size:32px;cursor:pointer}
.list{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.server{width:100%;min-height:86px;padding:16px 22px;display:flex;align-items:center;gap:17px;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--text);text-align:left;cursor:pointer}
.server:last-child{border-bottom:0}.server.selected{background:var(--active);box-shadow:inset 4px 0 var(--green)}
.flag{width:45px;height:45px;border-radius:12px;background:#202832;display:flex;align-items:center;justify-content:center;font-size:25px;flex-shrink:0}
.info{flex:1}.name{font-size:19px;font-weight:600}.protocol{color:var(--muted);font-size:14px;margin-top:6px}.check{color:var(--green);font-size:22px;width:25px;text-align:center}.server:not(.selected) .check{visibility:hidden}
button:focus{outline:3px solid var(--green);outline-offset:4px;z-index:2}.server:focus{background:#202c27}
.footer{margin-top:20px;display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.toast{position:fixed;bottom:30px;left:50%;transform:translate(-50%,20px);opacity:0;background:#1a2921;color:var(--green);border:1px solid #365b44;border-radius:30px;padding:14px 24px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:750px){.app{grid-template-columns:1fr;padding:20px;gap:20px;overflow:auto}.connect{width:180px;height:180px;min-width:180px;min-height:180px}.left{gap:15px}.server{min-height:70px}}
</style></head><body><div class="app">
<section class="left"><button class="connect" id="connect" aria-label="Подключить VPN">⏻</button><div class="status"><h2 id="status">Не подключено</h2><p id="description">Выбери сервер для подключения</p></div></section>
<section class="right"><div class="top"><div><h1>Серверы</h1><p class="count" id="count">Твои серверы · 5 доступно</p></div><button class="refresh" id="refresh" aria-label="Обновить серверы">↻</button></div><div class="list" id="list"></div><div class="footer"><span>ServersTV</span><span id="selected">Выбран: Германия</span></div></section></div><div class="toast" id="toast"></div>
<script>
const servers=[{id:1,flag:"🇩🇪",name:"Германия",protocol:"VLESS"},{id:2,flag:"🇳🇱",name:"Нидерланды",protocol:"VLESS"},{id:3,flag:"🇫🇮",name:"Финляндия",protocol:"VLESS"},{id:4,flag:"🇫🇷",name:"Франция",protocol:"VLESS"},{id:5,flag:"🇵🇱",name:"Польша",protocol:"VLESS"}];
let selected=1,connected=false;const $=id=>document.getElementById(id);
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>$("toast").classList.remove("show"),1900)}
function render(){$("list").innerHTML=servers.map(s=>'<button class="server '+(s.id===selected?'selected':'')+'" data-id="'+s.id+'"><span class="flag">'+s.flag+'</span><span class="info"><div class="name">'+s.name+'</div><div class="protocol">'+s.protocol+'</div></span><span class="check">✓</span></button>').join("");document.querySelectorAll(".server").forEach(b=>b.onclick=()=>{selected=+b.dataset.id;render();toast("Выбран сервер: "+servers.find(s=>s.id===selected).name)});$("count").textContent="Твои серверы · "+servers.length+" доступно";$("selected").textContent="Выбран: "+servers.find(s=>s.id===selected).name}
$("connect").onclick=()=>{toast("VPN-движок ещё не подключён");};
$("refresh").onclick=()=>toast("Подключение подписки будет добавлено следующим этапом");
document.addEventListener("keydown",e=>{const all=[$("connect"),$("refresh"),...document.querySelectorAll(".server")],i=all.indexOf(document.activeElement);if(["ArrowDown","ArrowUp"].includes(e.key)){e.preventDefault();all[(Math.max(i,0)+(e.key==="ArrowDown"?1:all.length-1))%all.length].focus()}else if(["ArrowLeft","ArrowRight"].includes(e.key)){e.preventDefault();if(document.activeElement.classList.contains("server"))$("connect").focus();else document.querySelector(".server")?.focus()}});
render();$("connect").focus();
</script></body></html>
